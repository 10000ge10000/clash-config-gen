services:
  clash-gen:
    build: ../..
    container_name: clash-gen
    restart: always
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - PUBLIC_BASE_URL=https://clash.910501.xyz
      - APP_DB_PATH=/app/data/app.db
      - ALLOW_REGISTRATION=false
      - WARP_PROVISION_ENABLED=true
      - WARP_API_BASE_URL=https://api.cloudflareclient.com
      - WARP_API_VERSION=v0a4471
      - WARP_CLIENT_VERSION=a-6.35-4471
      - WARP_PRESET_NAME=预制masque
      - WARP_PRESET_SERVER=saas.sin.fan
      - WARP_REQUEST_TIMEOUT_SECONDS=15
      - AUTH_COOKIE_SECURE=true
      - CSRF_SECRET=${CSRF_SECRET:?CSRF_SECRET must be set}
      - AUTH_RATE_LIMIT_WINDOW_SECONDS=${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      - AUTH_RATE_LIMIT_ACCOUNT_FAILURES=${AUTH_RATE_LIMIT_ACCOUNT_FAILURES:-5}
      - AUTH_RATE_LIMIT_IP_FAILURES=${AUTH_RATE_LIMIT_IP_FAILURES:-20}
      - RULESET_CACHE_ENABLED=true
      - RULESET_UPDATE_INTERVAL=604800
      - RULESET_CACHE_DIR=/app/ruleset/dustinwin
    volumes:
      - /opt/1panel/docker/compose/clash-config-gen/data:/app/data
      - /opt/clash-config-gen/ruleset:/app/ruleset
