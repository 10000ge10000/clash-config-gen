name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt pytest
      - name: 运行 pytest
        env:
          MIHOMO_VALIDATE_ENABLED: "false"
        run: python -m pytest tests/ -q

  e2e:
    name: 浏览器回归 (Playwright)
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: V2 工作台端到端（自举 FastAPI）
        env:
          MIHOMO_VALIDATE_ENABLED: "false"
        run: npm run test:v2
      - name: V1 Streamlit 界面回归（双服务）
        env:
          MIHOMO_VALIDATE_ENABLED: "false"
          AUTH_ALLOWED_ORIGINS: "http://127.0.0.1:8000,http://127.0.0.1:18501"
          UI_API_BASE_URL: "http://127.0.0.1:8000"
        run: |
          export PYTHONPATH=src
          export APP_DB_PATH="$RUNNER_TEMP/v1ui.db"
          export CSRF_SECRET=ci-secret-that-is-longer-than-32-chars
          export PUBLIC_BASE_URL=http://127.0.0.1:18501
          export AUTH_COOKIE_SECURE=false
          export ALLOW_REGISTRATION=true
          export RULESET_CACHE_ENABLED=false
          python -m uvicorn api:app --host 127.0.0.1 --port 8000 &
          python -m streamlit run src/web_app.py --server.port 18501 --server.headless true &
          sleep 12
          npm run test:ui
