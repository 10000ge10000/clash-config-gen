name: Docker Build and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r src/requirements.txt

      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser regression dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build local browser-test image
        run: docker build -t clash-config-gen-ui-test .

      - name: Run browser regression
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name clash-config-gen-ui-test \
            -p 8501:8501 -p 8000:8000 \
            --add-host host.docker.internal:host-gateway \
            -e PUBLIC_BASE_URL=http://127.0.0.1:18501 \
            -e APP_DB_PATH=/tmp/app.db \
            -e ALLOW_REGISTRATION=true \
            -e WARP_PROVISION_ENABLED=true \
            -e WARP_API_BASE_URL=http://host.docker.internal:18502 \
            -e AUTH_COOKIE_SECURE=false \
            -e CSRF_SECRET=ci-only-secret-that-is-longer-than-thirty-two-characters \
            -e RULESET_CACHE_ENABLED=false \
            clash-config-gen-ui-test
          node tests/reverse-proxy.mjs &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true; docker rm -f clash-config-gen-ui-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18501/health >/dev/null; then break; fi
            sleep 1
          done
          npm run test:ui

      - name: Install mihomo for sample validation
        shell: bash
        run: |
          set -euo pipefail
          version="v1.19.29"
          sha256="60de76a35a6cbf7b4fa4a20f5c257c24345d1d635ab1aa3877022a1997ef413c"
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${version}/mihomo-linux-amd64-${version}.gz" -o /tmp/mihomo.gz
          echo "${sha256}  /tmp/mihomo.gz" | sha256sum -c -
          gunzip /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          /tmp/mihomo -v

      - name: Validate sample config with mihomo
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import base64

          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from config_builder import build_config, build_yaml

          client_key = ec.generate_private_key(ec.SECP256R1())
          server_key = ec.generate_private_key(ec.SECP256R1()).public_key()

          config = build_config(
              [
                  {
                      "name": "sample",
                      "type": "ss",
                      "server": "127.0.0.1",
                      "port": 8388,
                      "cipher": "aes-128-gcm",
                      "password": "password",
                  },
                  {
                      "name": "预制masque",
                      "type": "masque",
                      "server": "saas.sin.fan",
                      "port": 443,
                      "private-key": base64.b64encode(client_key.private_bytes(
                          serialization.Encoding.DER,
                          serialization.PrivateFormat.TraditionalOpenSSL,
                          serialization.NoEncryption(),
                      )).decode("ascii"),
                      "public-key": base64.b64encode(server_key.public_bytes(
                          serialization.Encoding.DER,
                          serialization.PublicFormat.SubjectPublicKeyInfo,
                      )).decode("ascii"),
                      "udp": False,
                      "network": "h3-l4proxy",
                      "sni": "consumer-masque-proxy.cloudflareclient.com",
                  },
              ],
              {"generation_profile": "minimal"},
          )
          with open("/tmp/clash-config-gen-sample.yaml", "w", encoding="utf-8") as file:
              file.write(build_yaml(config))
          PY
          /tmp/mihomo -t -f /tmp/clash-config-gen-sample.yaml

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          image_name="${GITHUB_REPOSITORY,,}"
          echo "name=${REGISTRY}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
