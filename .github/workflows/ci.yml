name: CI

# main 分支由 docker-publish.yml 负责测试与发布，这里只覆盖 PR 与其他分支。
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 后端单元与 API 回归
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      MIHOMO_VALIDATE_ENABLED: "false"
      RULESET_CACHE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
      - name: 语法编译检查
        run: python -m compileall -q src
      - name: 运行单元测试
        env:
          RULESET_DIR: ${{ runner.temp }}/ruleset-unit
        run: python -m unittest discover -s tests -v

  e2e:
    name: Playwright 浏览器回归
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 25
    env:
      MIHOMO_VALIDATE_ENABLED: "false"
      RULESET_CACHE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: V2 工作台端到端（自举 FastAPI）
        env:
          RULESET_DIR: ${{ runner.temp }}/ruleset-v2
        run: npm run test:v2
      - name: V1 Streamlit 界面回归（双服务）
        env:
          PYTHONPATH: src
          RULESET_DIR: ${{ runner.temp }}/ruleset-v1
          AUTH_ALLOWED_ORIGINS: "http://127.0.0.1:8000,http://127.0.0.1:18501"
          UI_API_BASE_URL: "http://127.0.0.1:8000"
          CSRF_SECRET: ci-secret-that-is-longer-than-32-chars
          PUBLIC_BASE_URL: http://127.0.0.1:18501
          AUTH_COOKIE_SECURE: "false"
          ALLOW_REGISTRATION: "true"
        run: |
          export APP_DB_PATH="$RUNNER_TEMP/v1ui.db"
          python -m uvicorn api:app --host 127.0.0.1 --port 8000 &
          python -m streamlit run src/web_app.py --server.port 18501 --server.headless true &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && curl -sf -o /dev/null http://127.0.0.1:18501/ && break
            sleep 1
          done
          npm run test:ui
