name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest 单元与 API 回归
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      MIHOMO_VALIDATE_ENABLED: "false"
      RULESET_CACHE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml streamlit fastapi "uvicorn[standard]" python-multipart requests
      - name: 语法编译检查
        run: python -m py_compile src/*.py src/ui/*.py
      - name: 运行 pytest
        run: python -m pytest tests/ -q

  e2e:
    name: Playwright 浏览器回归
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml streamlit fastapi "uvicorn[standard]" python-multipart requests
      - name: 安装前端依赖
        run: npm install --no-fund --no-audit
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      - name: V2 界面端到端回归
        run: npm run test:v2
      - name: 启动 V1 双服务（Streamlit + FastAPI）
        env:
          PYTHONPATH: src
          APP_DB_PATH: /tmp/v1-e2e.db
          CSRF_SECRET: ci-secret-that-is-longer-than-thirty-two-characters
          PUBLIC_BASE_URL: http://127.0.0.1:18501
          AUTH_COOKIE_SECURE: "false"
          ALLOW_REGISTRATION: "true"
          MIHOMO_VALIDATE_ENABLED: "false"
          RULESET_CACHE_ENABLED: "false"
          AUTH_ALLOWED_ORIGINS: "http://127.0.0.1:8000,http://127.0.0.1:18501"
        run: |
          python -m uvicorn api:app --host 127.0.0.1 --port 8000 &
          python -m streamlit run src/web_app.py --server.port 18501 --server.headless true &
          sleep 12
          curl -sf http://127.0.0.1:8000/health
          curl -sf -o /dev/null http://127.0.0.1:18501/
      - name: V1 界面回归
        env:
          UI_API_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test tests/ui-regression.spec.mjs --workers=1
