services:
  clash-gen:
    build: .
    container_name: clash-gen
    restart: always
    ports:
      - "8501:8501" # Streamlit Web UI
      - "8000:8000" # Subscription API
    environment:
      - PUBLIC_BASE_URL=https://clash.910501.xyz
      - APP_DB_PATH=/app/data/app.db
      - ALLOW_REGISTRATION=true
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=change-this-admin-password
    volumes:
      - ./data:/app/data # 持久化用户、节点与订阅 Token
      - ./ruleset:/app/ruleset # 持久化自定义规则集（可选）
