services:
  clash-gen:
    # 生产建议固定为 sha-<提交短哈希> 标签（IMAGE_TAG=sha-xxxxxxx），避免 main 浮动标签带来不可控升级
    image: ghcr.io/10000ge10000/clash-config-gen:${IMAGE_TAG:-main}
    container_name: clash-gen
    restart: always
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8501:8501"
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?请在 .env 中设置 PUBLIC_BASE_URL，例如 https://sub.example.com}
      - APP_DB_PATH=/app/data/app.db
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - CSRF_SECRET=${CSRF_SECRET:?请在 .env 中设置 CSRF_SECRET，可用 openssl rand -hex 32 生成}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}
      - AUTH_RATE_LIMIT_WINDOW_SECONDS=${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      - AUTH_RATE_LIMIT_ACCOUNT_FAILURES=${AUTH_RATE_LIMIT_ACCOUNT_FAILURES:-5}
      - AUTH_RATE_LIMIT_IP_FAILURES=${AUTH_RATE_LIMIT_IP_FAILURES:-20}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - REGISTER_RATE_LIMIT_PER_WINDOW=${REGISTER_RATE_LIMIT_PER_WINDOW:-10}
      - REGISTER_RATE_LIMIT_WINDOW_SECONDS=${REGISTER_RATE_LIMIT_WINDOW_SECONDS:-3600}
      - EXTERNAL_FETCH_DEADLINE_SECONDS=${EXTERNAL_FETCH_DEADLINE_SECONDS:-30}
      - MIHOMO_HOME=${MIHOMO_HOME:-/app/data/mihomo-home}
      - MIHOMO_FIRST_RUN_TIMEOUT=${MIHOMO_FIRST_RUN_TIMEOUT:-60}
      - RULESET_CACHE_ENABLED=${RULESET_CACHE_ENABLED:-true}
      - RULESET_UPDATE_INTERVAL=${RULESET_UPDATE_INTERVAL:-604800}
      - RULESET_CACHE_DIR=/app/ruleset/dustinwin
    volumes:
      - ./data:/app/data
      - ./ruleset:/app/ruleset
