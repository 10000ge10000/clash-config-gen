services:
  clash-gen:
    image: ghcr.io/10000ge10000/clash-config-gen:main
    container_name: clash-gen
    restart: always
    ports:
      - "${WEB_PORT:-8501}:8501"
      - "${API_PORT:-8000}:8000"
    environment:
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - APP_DB_PATH=/app/data/app.db
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - WARP_PROVISION_ENABLED=${WARP_PROVISION_ENABLED:-true}
      - WARP_API_BASE_URL=${WARP_API_BASE_URL:-https://api.cloudflareclient.com}
      - WARP_API_VERSION=${WARP_API_VERSION:-v0a4471}
      - WARP_CLIENT_VERSION=${WARP_CLIENT_VERSION:-a-6.35-4471}
      - WARP_PRESET_NAME=${WARP_PRESET_NAME:-预制masque}
      - WARP_PRESET_SERVER=${WARP_PRESET_SERVER:-saas.sin.fan}
      - WARP_REQUEST_TIMEOUT_SECONDS=${WARP_REQUEST_TIMEOUT_SECONDS:-15}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - CSRF_SECRET=${CSRF_SECRET:?CSRF_SECRET must be set}
      - AUTH_RATE_LIMIT_WINDOW_SECONDS=${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      - AUTH_RATE_LIMIT_ACCOUNT_FAILURES=${AUTH_RATE_LIMIT_ACCOUNT_FAILURES:-5}
      - AUTH_RATE_LIMIT_IP_FAILURES=${AUTH_RATE_LIMIT_IP_FAILURES:-20}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RULESET_CACHE_ENABLED=${RULESET_CACHE_ENABLED:-true}
      - RULESET_UPDATE_INTERVAL=${RULESET_UPDATE_INTERVAL:-604800}
      - RULESET_CACHE_DIR=/app/ruleset/dustinwin
    volumes:
      - ./data:/app/data
      - ./ruleset:/app/ruleset
