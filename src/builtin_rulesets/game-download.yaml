# 游戏下载直连名单（内置规则集 game-download，behavior: domain，默认目标 DIRECT）
#
# 维护规则：
# - 只写厂商专用主机名或厂商专用子域；禁止整段放行公共 CDN 后缀
#   （+.gcdn.co、+.fastly.net、+.akamai.net、+.akamaized.net、+.akamaihd.net、
#   +.cloudfront.net、+.edgesuite.net、+.llnwd.net 等），否则会把大量海外网站带成直连。
# - 每条注明平台与依据；查不到公开依据、只是同类推断的条目标“待核实”。
# - 只做分流，不做 DNS 映射或 Hosts 改写：国内 CDN（*.xboxlive.cn）只接受 .cn 主机名，
#   把 .com 下载域名解析到 .cn 的 IP 会返回 403。
# - 改动后文件会随镜像发布，客户端按 interval（86400 秒）拉取新版本。
#
# 依据缩写：
#   [MS]     https://learn.microsoft.com/en-us/windows/deployment/do/delivery-optimization-endpoints
#   [LC-x]   https://github.com/uklans/cache-domains 中的 x.txt（LAN cache 社区名单，非厂商官方）
#   [DW]     DustinWin/ruleset_geodata 的 games-cn / microsoft-cn 已收录
#   [实测]   2026-11-15 OpenWrt（OpenClash）抓到的 Xbox 实际下载连接
payload:
  # ---------- Xbox / Microsoft Store ----------
  - 'assets1.xboxlive.com'              # Xbox 下载 [LC-xboxlive][实测]
  - 'assets2.xboxlive.com'              # Xbox 下载 [LC-xboxlive]
  - 'd1.xboxlive.com'                   # Xbox 下载 [LC-xboxlive]
  - 'd2.xboxlive.com'                   # Xbox 下载，待核实（d1 的同类主机）
  - 'dlassets.xboxlive.com'             # Xbox 下载，待核实
  - 'dlassets2.xboxlive.com'            # Xbox 下载，待核实
  - 'xbox-mbr.xboxlive.com'             # Xbox 下载 [LC-xboxlive]
  - 'xvcf1.xboxlive.com'                # Xbox 下载 [LC-xboxlive]
  - 'xvcf2.xboxlive.com'                # Xbox 下载 [LC-xboxlive]
  - 'assets1.xboxlive.com.nsatc.net'    # Xbox 下载 [LC-xboxlive]
  - '+.xboxlive.com.edgesuite.net'      # Xbox 下载（Akamai 上的厂商专用子域）[LC-xboxlive][实测]
  - 'download.xbox.com'                 # Xbox 360 内容 [LC-xboxlive]
  - 'download.xbox.com.edgesuite.net'   # Xbox 360 内容 [LC-xboxlive]
  - '+.xboxlive.cn'                     # Xbox 国内 CDN [DW][实测：只接受 .cn 主机名]
  - '+.xb.delivery.microsoft.com'       # Xbox 下载调度服务 [实测：5.xb.delivery.microsoft.com]
  - '+.dl.delivery.mp.microsoft.com'    # 微软商店 / PC Game Pass / Windows 更新下载 [MS][DW]
  - 'fg.microsoft.map.fastly.net'       # 微软在 Fastly 上的专用主机名 [实测]
  # G-Core 分配给微软的客户编号主机名，编号以后可能变化。变化后按路由器上的实际下载连接补充新主机名，
  # 不要改成 +.gcdn.co。
  - 'cl-glcb907925.gcdn.co'             # Xbox 下载（G-Core）[实测：流量大头]

