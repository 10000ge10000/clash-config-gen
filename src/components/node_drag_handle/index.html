<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 48px; margin: 0; overflow: hidden; background: transparent; }
    body { display: grid; place-items: center; }
    button {
      display: grid; place-items: center; width: 44px; height: 44px; padding: 0;
      color: #7390ad; border: 1px solid transparent; border-radius: 12px;
      background: transparent; cursor: grab; touch-action: none;
      transition: color 160ms ease, border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }
    button:hover { color: #1769ff; border-color: #c8ddf0; background: #edf6ff; }
    button:focus-visible { outline: 3px solid rgba(23, 105, 255, .22); outline-offset: 1px; }
    button:active, button.dragging { cursor: grabbing; transform: scale(.96); }
    svg { width: 20px; height: 20px; }
    circle { fill: currentColor; }
    body.drag-over button { color: #0d8e92; border-color: #8adbd4; background: #e8fbf8; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <button id="handle" type="button" draggable="true" aria-label="拖动节点排序，或使用 Alt 加上下方向键">
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="6" cy="5" r="1.5"/><circle cx="14" cy="5" r="1.5"/>
      <circle cx="6" cy="10" r="1.5"/><circle cx="14" cy="10" r="1.5"/>
      <circle cx="6" cy="15" r="1.5"/><circle cx="14" cy="15" r="1.5"/>
    </svg>
  </button>
  <script>
    const handle = document.getElementById('handle');
    let args = { index: 0, name: '' };

    function post(type, extra = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...extra }, '*');
    }
    function setValue(value) { post('streamlit:setComponentValue', { value }); }
    function setHeight() { post('streamlit:setFrameHeight', { height: 48 }); }
    function reorder(sourceIndex, targetIndex, method) {
      if (!Number.isInteger(sourceIndex) || !Number.isInteger(targetIndex) || sourceIndex === targetIndex) return;
      setValue({ source_index: sourceIndex, target_index: targetIndex, method, nonce: `${Date.now()}-${Math.random()}` });
    }

    window.addEventListener('message', (event) => {
      if (event.data?.type !== 'streamlit:render') return;
      args = event.data.args || args;
      handle.setAttribute('aria-label', `拖动 ${args.name || '节点'} 排序，或使用 Alt 加上下方向键`);
      setHeight();
    });

    handle.addEventListener('dragstart', (event) => {
      handle.classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', String(args.index));
      event.dataTransfer.setData('application/x-ccg-node-index', String(args.index));
    });
    handle.addEventListener('dragend', () => handle.classList.remove('dragging'));
    document.body.addEventListener('dragover', (event) => {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      document.body.classList.add('drag-over');
    });
    document.body.addEventListener('dragleave', (event) => {
      if (!document.body.contains(event.relatedTarget)) document.body.classList.remove('drag-over');
    });
    document.body.addEventListener('drop', (event) => {
      event.preventDefault();
      document.body.classList.remove('drag-over');
      const raw = event.dataTransfer.getData('application/x-ccg-node-index') || event.dataTransfer.getData('text/plain');
      reorder(Number.parseInt(raw, 10), Number.parseInt(args.index, 10), 'drag');
    });
    handle.addEventListener('keydown', (event) => {
      if (!event.altKey || !['ArrowUp', 'ArrowDown'].includes(event.key)) return;
      event.preventDefault();
      const delta = event.key === 'ArrowUp' ? -1 : 1;
      reorder(Number(args.index), Number(args.index) + delta, 'keyboard');
    });

    post('streamlit:componentReady', { apiVersion: 1 });
    setHeight();
  </script>
</body>
</html>
